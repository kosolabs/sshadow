name: Publish DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish the DMG for
        required: true
        type: string
  release:
    types: [ published ]

jobs:
  publish-dmg:
    name: Build and publish DMG
    runs-on: xcode-27

    environment:
      name: sshadow-release

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag || github.event.release.tag_name }}

    - name: Install signing
      uses: ./.github/actions/install-signing
      with:
        developer-id-certificate-p12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
        developer-id-certificate-password: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        apple-development-certificate-p12: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_P12 }}
        apple-development-certificate-password: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
        provisioning-profile-app: ${{ secrets.PROVISIONING_PROFILE_APP }}
        provisioning-profile-extension: ${{ secrets.PROVISIONING_PROFILE_EXTENSION }}

    - name: Build, sign, and notarize DMG
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      run: ./ci_scripts/dmg.sh

    - name: Upload DMG to release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ inputs.tag || github.event.release.tag_name }}"

        # --clobber replaces the asset if the workflow is re-run on the same release.
        gh release upload "$TAG" build/SSHadow.dmg --clobber
