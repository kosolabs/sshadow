name: Release

on:
  push:
    branches: [ main ]

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-26

    environment:
      name: sshadow-release

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Import signing certificates
      env:
        DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
        DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        APPLE_DEVELOPMENT_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_P12 }}
        APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
      run: |
        KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PASSWORD="$(uuidgen)"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        import_cert() {
          local base64_content="$1" password="$2"
          local cert_path="$RUNNER_TEMP/certificate.p12"

          base64 --decode -o "$cert_path" <<<"$base64_content"
          security import "$cert_path" -P "$password" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$cert_path"
        }

        import_cert "$DEVELOPER_ID_CERTIFICATE_P12" "$DEVELOPER_ID_CERTIFICATE_PASSWORD"
        import_cert "$APPLE_DEVELOPMENT_CERTIFICATE_P12" "$APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD"

        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH"

    - name: Install provisioning profiles
      env:
        PROVISIONING_PROFILE_APP: ${{ secrets.PROVISIONING_PROFILE_APP }}
        PROVISIONING_PROFILE_EXTENSION: ${{ secrets.PROVISIONING_PROFILE_EXTENSION }}
      run: |
        PROFILES_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
        mkdir -p "$PROFILES_DIR"

        install_profile() {
          local base64_content="$1"
          local profile_path plist_path uuid

          profile_path="$RUNNER_TEMP/profile.provisionprofile"
          plist_path="$RUNNER_TEMP/profile.plist"
          base64 --decode -o "$profile_path" <<<"$base64_content"

          security cms -D -i "$profile_path" >"$plist_path"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist_path")"

          mv "$profile_path" "$PROFILES_DIR/$uuid.provisionprofile"
          rm -f "$plist_path"
        }

        install_profile "$PROVISIONING_PROFILE_APP"
        install_profile "$PROVISIONING_PROFILE_EXTENSION"

    - name: Build, sign, and notarize DMG
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      run: ./ci_scripts/dmg.sh

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        BUILD_NUMBER="$(git rev-list --count HEAD)"
        MARKETING_VERSION="$(xcodebuild -showBuildSettings -scheme SSHadow -configuration Release 2>/dev/null | awk -F' = ' '/MARKETING_VERSION/ {print $2}')"
        TAG="v${BUILD_NUMBER}"

        # Replace any existing release for this build (e.g. re-running the
        # workflow on the same commit).
        gh release delete "$TAG" --yes || true

        gh release create "$TAG" build/SSHadow.dmg \
          --title "SSHadow v${MARKETING_VERSION} build ${BUILD_NUMBER}" \
          --generate-notes
