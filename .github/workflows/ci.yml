name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Tests
    runs-on: macos-26

    environment:
      name: sshadow-release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Check MARKETING_VERSION wiring
      run: ./ci_scripts/check_config.sh

    - name: Start SSH test server
      run: ./ci_scripts/start_test_server.sh

    - name: Run unit tests
      run: xcodebuild test -scheme SSHadow -testPlan UnitTests -destination 'platform=macOS' -retry-tests-on-failure -test-iterations 3 CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_ENTITLEMENTS="" CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO

    # - name: Run UI tests
    #   run: xcodebuild test -scheme SSHadow -testPlan UITests -destination 'platform=macOS'

    - name: Stop SSH test server
      if: always()
      run: ./ci_scripts/stop_test_server.sh
