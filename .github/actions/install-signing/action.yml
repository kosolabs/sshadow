name: Install signing
description: Import the signing certificates and provisioning profiles into a temporary keychain.

inputs:
  developer-id-certificate-p12:
    required: true
  developer-id-certificate-password:
    required: true
  apple-development-certificate-p12:
    required: true
  apple-development-certificate-password:
    required: true
  provisioning-profile-app:
    required: true
  provisioning-profile-extension:
    required: true

runs:
  using: composite
  steps:
  - name: Import signing certificates
    shell: bash
    env:
      DEVELOPER_ID_CERTIFICATE_P12: ${{ inputs.developer-id-certificate-p12 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ inputs.developer-id-certificate-password }}
      APPLE_DEVELOPMENT_CERTIFICATE_P12: ${{ inputs.apple-development-certificate-p12 }}
      APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ inputs.apple-development-certificate-password }}
    run: |
      KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
      KEYCHAIN_PASSWORD="$(uuidgen)"

      security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
      security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      import_cert() {
        local base64_content="$1" password="$2"
        local cert_path="$RUNNER_TEMP/certificate.p12"

        base64 --decode -o "$cert_path" <<<"$base64_content"
        security import "$cert_path" -P "$password" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        rm -f "$cert_path"
      }

      import_cert "$DEVELOPER_ID_CERTIFICATE_P12" "$DEVELOPER_ID_CERTIFICATE_PASSWORD"
      import_cert "$APPLE_DEVELOPMENT_CERTIFICATE_P12" "$APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD"

      security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      security list-keychains -d user -s "$KEYCHAIN_PATH"

  - name: Install provisioning profiles
    shell: bash
    env:
      PROVISIONING_PROFILE_APP: ${{ inputs.provisioning-profile-app }}
      PROVISIONING_PROFILE_EXTENSION: ${{ inputs.provisioning-profile-extension }}
    run: |
      PROFILES_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
      mkdir -p "$PROFILES_DIR"

      install_profile() {
        local base64_content="$1"
        local profile_path plist_path uuid

        profile_path="$RUNNER_TEMP/profile.provisionprofile"
        plist_path="$RUNNER_TEMP/profile.plist"
        base64 --decode -o "$profile_path" <<<"$base64_content"

        security cms -D -i "$profile_path" >"$plist_path"
        uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist_path")"

        mv "$profile_path" "$PROFILES_DIR/$uuid.provisionprofile"
        rm -f "$plist_path"
      }

      install_profile "$PROVISIONING_PROFILE_APP"
      install_profile "$PROVISIONING_PROFILE_EXTENSION"
